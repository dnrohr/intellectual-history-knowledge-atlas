name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run lint

      - name: Validate canonical dataset
        run: npm run qa:canonical

      - name: Validate bulk edge structure
        run: npm run qa:edges

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e
